[jobs.check]
command = ["cargo", "check", "--all-targets", "--all-features"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run"]
need_stdout = true

[jobs.clippy]
command = [
  "cargo",
  "clippy",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
need_stdout = false

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

[keybindings]
c = "job:check"
t = "job:test"
l = "job:clippy"
d = "job:doc"
