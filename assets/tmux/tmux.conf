# tmux.conf
########################################

# Resolve the asset root once. Keep shell references to this variable quoted;
# expanding paths into shell program text would reinterpret quotes and $().
%if "#{==:#{TMUX_HOME},}"
  %if "#{==:#{XDG_CONFIG_HOME},}"
    TMUX_HOME="$HOME/.config/tmux"
  %else
    TMUX_HOME="$XDG_CONFIG_HOME/tmux"
  %endif
%endif

setw -g automatic-rename on      # rename window after current program
set  -g renumber-windows on      # renumber windows when one is closed
# Zero-based indexing is fine in programming languages, but not so much in a
# multiplexer when zero is on the other side of the keyboard.
set  -g base-index 1
setw -g pane-base-index 1
# display tmux messages longer
set  -g display-time 1500
set  -g display-panes-time 800
# Address vim-mode switching delay (http://superuser.com/a/252717/65504)
set  -s escape-time   40
set -sg repeat-time   600
set  -g history-limit 50000
# Update status-{left,right} more often (default: 15)
set  -g status-interval 5
# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize off
# For terminals that support them, propagate these events to programs that
# understand them.
set  -s focus-events on
# Enable mouse + mouse wheel
set  -g mouse on
# Transparent status bar, by default
set  -g status-style bg=default

# Load generated theme/plugin config on initial server startup. Reloads skip
# plugin init because some plugin scripts are long-running.
if -F '#{!=:#{@hey_reload},1}' {
  if-shell 'test -f "$TMUX_HOME/extraInit"' {
    source-file -F '#{TMUX_HOME}/extraInit'
  }
}

########################################
# Keybinds                             #
########################################

# Rebind prefix to C-c. Press twice to send literal C-c.
unbind C-b
set -g prefix C-c
bind C-c send-prefix
bind C-b display-message

# Vi-style keybinds
set -g status-keys vi
set -g mode-keys   vi

bind c new-window      -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane left'
bind J run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane down'
bind K run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane up'
bind L run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane right'
bind M run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane master'
bind G run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" git #{pane_id}'
bind N run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" nix #{pane_id}'
bind E run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" direnv #{pane_id}'

bind o resize-pane -Z
bind Space display-menu -T "tmux" \
  "New window" c "new-window -c '#{pane_current_path}'" \
  "New session" C "command-prompt -p 'new session:' \"new-session -d -s '%%' -c '#{pane_current_path}' ; switch-client -t '%%'\"" \
  "" \
  "Choose session" S "choose-session" \
  "Choose window" W "choose-window" \
  "Last window" Tab "last-window" \
  "Previous session" "(" "switch-client -p" \
  "Next session" ")" "switch-client -n" \
  "" \
  "Horizontal split" h "split-window -h -c '#{pane_current_path}'" \
  "Vertical split" v "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane" o "resize-pane -Z" \
  "Swap pane left" H { run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane left' } \
  "Swap pane right" L { run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" tmux swap-pane right' } \
  "" \
  "Git status" G { run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" git #{pane_id}' } \
  "Nix context" N { run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" nix #{pane_id}' } \
  "Direnv context" E { run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" direnv #{pane_id}' } \
  "" \
  "Reload config" r { run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" reload tmux' } \
  "List keys" ? "list-keys"
bind S choose-session
bind W choose-window
bind / choose-session
bind . choose-window

# Window/session management
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1
bind ( switch-client -p
bind ) switch-client -n
bind C command-prompt -p "new session:" "new-session -d -s '%1' -c '#{pane_current_path}' ; switch-client -t '%1'"

# bind = select-layout tiled
bind | select-layout even-horizontal
bind _ select-layout even-vertical

# Disable confirmation
bind x kill-pane
bind X kill-window
bind q kill-session
bind Q kill-server

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind C-w last-pane
bind Tab last-window
bind C-n next-window
bind C-p previous-window

bind = select-layout even-tiled     # balance-windows analogue (sort of)
bind - break-pane
bind _ join-pane

# reload config without killing server
bind r run-shell 'zsh -f "$TMUX_HOME/bin/hey.zsh" reload tmux'
bind ^r refresh-client


########################################
# Copy mode                            #
########################################

bind Enter copy-mode # enter copy mode
bind b list-buffers  # list paster buffers
bind B choose-buffer # choose which buffer to paste from
bind p paste-buffer  # paste from the top paste buffer
bind P run-shell 'if command -v pbpaste >/dev/null 2>&1; then pbpaste; elif command -v wl-paste >/dev/null 2>&1; then wl-paste; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -o; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --output; else exit 1; fi | tmux load-buffer - && tmux paste-buffer'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-g send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line


########################################
# Local config                         #
########################################
if-shell 'test -f "$TMUX_HOME/tmux.local.conf"' {
  source-file -F '#{TMUX_HOME}/tmux.local.conf'
}
