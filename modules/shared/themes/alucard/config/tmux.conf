# -- THEME -------------------------------

# The statusbar
set -g status-position bottom
set -g status-justify centre
set -g status-style bg=colour0,fg=colour5
set -g status-left '#{prefix_highlight}#[fg=colour238]|#[fg=colour8]#{S: #S#{?session_attached,+,} ,#[fg=colour5,bold] #S*#{?session_attached,+,} #[fg=colour8]}#[fg=colour238]|'
set -g status-right '#[fg=colour238]| #[fg=colour8]#(zsh -f "$TMUX_HOME/bin/status-right.zsh" "#{pane_id}") #[fg=colour238]|'
set -g status-right-length 80
set -g status-left-length 80

# The messages
set -g message-style fg=magenta,bg=colour236
set -g message-command-style fg=blue,bg=black

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on
set-option -g bell-action none

# The modes
setw -g clock-mode-colour colour135
# setw -g mode-attr bold
# setw -g mode-fg colour196
# setw -g mode-bg colour238

# The panes
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour5

# setw -g window-status-current-fg colour2
# setw -g window-status-current-bg default
# setw -g window-status-current-attr none
# setw -g window-status-current-format ' #W '

# setw -g window-status-fg colour236
# setw -g window-status-bg default
# setw -g window-status-attr none
# setw -g window-status-format '#[fg=colour8] #I #[fg=default]#W '
setw -g window-status-format ' #W '
bind -n MouseDown1Status if -F '#{||:#{==:#{mouse_status_range},git},#{||:#{==:#{mouse_status_range},nix},#{==:#{mouse_status_range},direnv}}}' \
  { run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" #{q:mouse_status_range} #{pane_id}' } \
  'switch-client -t ='

