# -- KOKEDERA THEME ----------------------

# 24-bit color support for capable terminals.
set-option -sa terminal-overrides ",xterm*:Tc"

# The statusbar
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5
set -g status-style "fg=#c8d8b8,bg=#151e14"
set -g status-left '#{prefix_highlight}#[fg=#3a4a35]|#[fg=#4ca64c]#{S: #S#{?session_attached,+,} ,#[fg=#7ec46c,bold] #S*#{?session_attached,+,} #[fg=#4ca64c]}#[fg=#3a4a35]|'
set -g status-right '#[fg=#3a4a35]| #[fg=#c8d8b8]#(zsh -f "$TMUX_HOME/bin/status-right.zsh" "#{pane_id}") #[fg=#3a4a35]|'
set -g status-right-length 150
set -g status-left-length 100

# The messages
set -g message-style "fg=#c8d8b8,bg=#243322"
set -g message-command-style "fg=#bfa243,bg=#121a11"

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on
set-option -g bell-action none

# The modes
setw -g clock-mode-colour "#7ec46c"
setw -g mode-style "fg=#c8d8b8,bg=#2a3d26"

# The panes
set -g pane-border-style "fg=#3a4a35"
set -g pane-active-border-style "fg=#4ca64c"
set -g display-panes-colour "#3a4a35"
set -g display-panes-active-colour "#7ec46c"

# The windows
setw -g window-status-style "fg=#7a9070,bg=#151e14"
setw -g window-status-format " #W "
setw -g window-status-current-style "fg=#c8d8b8,bg=#1a2619,bold"
setw -g window-status-current-format " #W "
bind -n MouseDown1Status if -F '#{||:#{==:#{mouse_status_range},git},#{||:#{==:#{mouse_status_range},nix},#{==:#{mouse_status_range},direnv}}}' \
  { run-shell 'zsh -f "$TMUX_HOME/bin/status-action.zsh" #{q:mouse_status_range} #{pane_id}' } \
  'switch-client -t ='

# tmux-prefix-highlight
set -g @prefix_highlight_fg '#121a11'
set -g @prefix_highlight_bg '#7ec46c'
set -g @prefix_highlight_copy_mode_attr 'fg=#121a11,bg=#3d9970'
set -g @prefix_highlight_prefix_prompt 'C-c'
set -g @prefix_highlight_show_copy_mode 'on'
